publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  device_preview: ^1.3.1
  flutter:
    sdk: flutter
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
