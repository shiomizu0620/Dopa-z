name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 静的解析とテスト
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # .fvmrc と同じバージョンに揃えること
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.1
          channel: stable
          cache: true

      - name: 依存パッケージの取得
        run: flutter pub get

      - name: フォーマット確認
        run: dart format --set-exit-if-changed lib test

      - name: 静的解析
        run: flutter analyze

      - name: テスト
        run: flutter test
