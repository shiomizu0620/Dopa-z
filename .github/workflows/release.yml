name: Release APK

# v1.0.0 のようなタグを打つとリリースAPKをビルドし、
# GitHub Releases に添付する。
# 手動実行 (workflow_dispatch) の場合はビルドのみ行い、
# 成果物としてダウンロードできる状態にする。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: リリースAPKのビルド
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Android Gradle Plugin 8.9 は Java 17 以上が必要
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # .fvmrc と同じバージョンに揃えること
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.1
          channel: stable
          cache: true

      - name: 依存パッケージの取得
        run: flutter pub get

      - name: 静的解析
        run: flutter analyze

      - name: テスト
        run: flutter test

      - name: リリースAPKのビルド
        run: flutter build apk --release

      - name: 成果物としてアップロード
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: GitHub Releases に添付
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "dopaz-${GITHUB_REF_NAME}.apk"
          cat > notes.md <<'EOF'
          ## インストール

          下の `dopaz-*.apk` をダウンロードして端末で開いてください
          (「提供元不明のアプリ」のインストール許可が必要です)。

          ## 注意

          このAPKは **デバッグ鍵で署名されています**。ストアには配布できません。
          別の署名の dopaz が既に入っている端末では、先にアンインストールが必要です。

          変更点はコミット履歴を参照してください。
          EOF
          gh release create "$GITHUB_REF_NAME" "dopaz-${GITHUB_REF_NAME}.apk" \
            --title "dopaz $GITHUB_REF_NAME" \
            --notes-file notes.md
